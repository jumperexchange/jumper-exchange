name: Playwright Tests
on:
  - pull_request
  - workflow_dispatch
permissions:
  checks: write
  pull-requests: write
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  create-qase-run:
    name: Create Qase Run
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 3
    outputs:
      run_id: ${{ steps.create-run.outputs.run_id }}
      public_link: ${{ steps.create-public-link.outputs.public_link }}
    steps:
      - name: Create Qase Test Run
        id: create-run
        run: |
          if [ -z "${{ secrets.QASE_TOKEN }}" ]; then
            echo "No Qase API token available, skipping Qase run creation"
            exit 0
          fi

          RUN_TITLE="[Jumper Exchange] CI Run ${{ github.run_id }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_URL="${{ github.event.pull_request.html_url }}"
            DESCRIPTION="Pull Request: [$PR_URL]($PR_URL)"
          else
            DESCRIPTION=""
          fi

          data=$(jq -n \
            --arg title "$RUN_TITLE" \
            --arg description "$DESCRIPTION" \
            '{title: $title, description: $description}')

          response=$(curl --silent --fail --show-error --request POST \
            --url https://api.qase.io/v1/run/WJ \
            --header "Token: ${{ secrets.QASE_TOKEN }}" \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data "$data")

          run_id=$(echo "$response" | jq -r '.result.id')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          echo "Qase API Response: $response"
          echo "Extracted Run ID: $run_id"

      - name: Create public link to run
        id: create-public-link
        run: |
          public_link=$(curl --silent --fail --show-error --request PATCH \
            --url "https://api.qase.io/v1/run/WJ/${{ steps.create-run.outputs.run_id }}/public" \
            --header "Token: ${{ secrets.QASE_TOKEN }}" \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data '{"status":true}' \
            | jq -r '.result.url')

          echo "public_link=$public_link" >> "$GITHUB_OUTPUT"
          echo "Public link: $public_link"
  test:
    needs: [create-qase-run]
    name: Test (${{ matrix.shard }} / ${{ strategy.job-total}})
    continue-on-error: false # Instead we use fail-fast to forward the failure state to subsequent jobs
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        env:
          QASE_TESTOPS_RUN_ID: ${{ needs.create-qase-run.outputs.run_id || '' }}
          QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TOKEN }}
        if: ${{ !cancelled()}} # Always attempt to run the tests even if cache setup failed
        run: |
          if [ -n "${{ secrets.QASE_TOKEN }}" ] && [ -n "$QASE_TESTOPS_RUN_ID" ]; then
            echo "Running tests with Qase reporting (Run ID: $QASE_TESTOPS_RUN_ID)"
            pnpm run test:ci:e2e:qase \
              --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          else
            echo "Running tests without Qase reporting (API token or run ID not available)"
            pnpm run test:ci:e2e \
              --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          fi
      - name: Upload blob report to Github Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    timeout-minutes: 3
    outputs:
      summary: ${{ steps.summary.outputs.summary }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Download blob reports from GitHub Actions Articfacts
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML and JSON Reports
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
      - uses: daun/playwright-report-summary@be9e270edd5ad86038604d3caa84a819a6ff6fed # v3.10.0
        id: summary
        with:
          report-file: ./report.json
          create-comment: false
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
          retention-days: 2

  publish-report:
    if: ${{ !cancelled() }}
    needs: [merge-reports]
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.set-url.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download HTML report
        uses: actions/download-artifact@v4
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: playwright-report
      - name: Determine report destination
        id: report-dest
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEST_DIR="${{ github.event.pull_request.number }}"
          else
            DEST_DIR="${{ github.run_id }}"
          fi
          echo "destination=$DEST_DIR" >> "$GITHUB_OUTPUT"
          echo "Report will be published to: $DEST_DIR"
      - name: Prepare report for Pages
        run: |
          mkdir -p pages-artifact/${{ steps.report-dest.outputs.destination }}
          cp -r playwright-report/* pages-artifact/${{ steps.report-dest.outputs.destination }}/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Set page URL
        id: set-url
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPORT_PATH="${{ github.event.pull_request.number }}"
          else
            REPORT_PATH="${{ github.run_id }}"
          fi
          # Extract repo name from github.repository (format: owner/repo)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          PAGE_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/${REPORT_PATH}/"
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Report URL: $PAGE_URL"
      - name: Add report link to summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REPORT_PATH="${{ github.event.pull_request.number }}"
          else
            REPORT_PATH="${{ github.run_id }}"
          fi
          # Extract repo name from github.repository (format: owner/repo)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${REPO_NAME}/${REPORT_PATH}/"
          echo "## 📊 Playwright Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[View Report](${PAGES_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  post-comment:
    needs: [create-qase-run, merge-reports, publish-report]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ${{ needs.merge-reports.outputs.summary }}

            ${{ needs.create-qase-run.outputs.public_link != '' && needs.create-qase-run.outputs.public_link != null && format('📋 [View Detailed Qase Report]({0})', needs.create-qase-run.outputs.public_link) || '' }}

            ${{ needs.publish-report.outputs.page_url != '' && needs.publish-report.outputs.page_url != null && format('📊 [View HTML Test Report]({0})', needs.publish-report.outputs.page_url) || '📊 HTML Test Report will be available after deployment' }}
