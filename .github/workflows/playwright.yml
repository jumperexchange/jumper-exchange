name: Playwright Tests
on:
  - pull_request
  - workflow_dispatch
permissions:
  checks: write
  pull-requests: write
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  create-qase-run:
    name: Create Qase Run
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 3
    outputs:
      run_id: ${{ steps.create-run.outputs.run_id }}
      public_link: ${{ steps.create-public-link.outputs.public_link }}
    steps:
      - name: Create Qase Test Run
        id: create-run
        env:
          QASE_TOKEN: ${{ secrets.QASE_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_EVENT_NAME: ${{ github.event_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$QASE_TOKEN" ]; then
            echo "No Qase API token available, skipping Qase run creation"
            exit 0
          fi

          RUN_TITLE="[Jumper] CI Run $GH_RUN_ID"

          if [ "$GH_EVENT_NAME" = "pull_request" ]; then
            DESCRIPTION="Pull Request: [$PR_URL]($PR_URL)"
          else
            DESCRIPTION=""
          fi

          data=$(jq -n \
            --arg title "$RUN_TITLE" \
            --arg description "$DESCRIPTION" \
            '{title: $title, description: $description}')

          response=$(curl --silent --fail --show-error --request POST \
            --url https://api.qase.io/v1/run/WJ \
            --header "Token: $QASE_TOKEN" \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data "$data")

          run_id=$(echo "$response" | jq -r '.result.id')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          echo "Qase API Response: $response"
          echo "Extracted Run ID: $run_id"

      - name: Create public link to run
        id: create-public-link
        env:
          QASE_TOKEN: ${{ secrets.QASE_TOKEN }}
          QASE_RUN_ID: ${{ steps.create-run.outputs.run_id }}
        run: |
          public_link=$(curl --silent --fail --show-error --request PATCH \
            --url "https://api.qase.io/v1/run/WJ/$QASE_RUN_ID/public" \
            --header "Token: $QASE_TOKEN" \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data '{"status":true}' \
            | jq -r '.result.url')

          echo "public_link=$public_link" >> "$GITHUB_OUTPUT"
          echo "Public link: $public_link"
  # One build shared by all shards: the build prerenders against live Strapi/backend,
  # so every extra build is another chance for a transient upstream blip to abort a
  # shard ("Export encountered an error"). Building here also turns a build failure
  # into a single red job instead of every shard failing with 0 tests.
  build:
    name: Build App
    runs-on: ubuntu-latest
    # Covers the retry path: install + two full build attempts + pack/upload.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Build production bundle
        env:
          E2E_PROD_BUILD: "1" # plain (non-standalone) build that `next start` serves
        run: |
          # Load tests/.env.test the way Playwright's webServer does (dotenv) — a
          # bare `pnpm run build` lacks those vars, and the bundle must match what
          # the shards serve. The retry absorbs a transient prerender-fetch failure.
          build() {
            node -e "require('dotenv').config({ path: './tests/.env.test' }); require('child_process').execSync('pnpm run build', { stdio: 'inherit' })"
          }
          for attempt in 1 2; do
            if build; then exit 0; fi
            echo "::warning::Build attempt ${attempt} failed"
            rm -rf .next
          done
          exit 1
      - name: Pack build for the shards
        # A single zstd tar instead of thousands of small files — per-file upload
        # overhead dwarfs the transfer otherwise, and .next is several GB raw (SSG
        # pages × every locale). .next/cache is rebuild-only; `next start` never
        # reads it, so it stays out.
        run: |
          tar -I 'zstd -T0' -cf next-build.tar.zst --exclude='.next/cache' .next
          du -sh next-build.tar.zst
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build
          path: next-build.tar.zst
          # 4 days (matching the html report): "Re-run failed jobs" does not re-run the
          # succeeded build job, so a late re-run must still find the artifact.
          retention-days: 4
          compression-level: 0 # already zstd-compressed

  test:
    needs: [create-qase-run, build]
    name: Test (${{ matrix.shard }} / ${{ strategy.job-total}})
    continue-on-error: false # Instead we use fail-fast to forward the failure state to subsequent jobs
    # 30 min: headroom for `test.slow()` specs (swapActions/mainMenu) + a 90s
    # Hyperliquid case; the app arrives prebuilt from the build job.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5]
      fail-fast: false
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: |
          pnpm exec playwright install --with-deps chromium
      - name: Install xvfb and xclip
        # xclip owns the CLIPBOARD selection under xvfb; the wallet seed is pasted
        # (not typed) into MetaMask so it never lands in a Playwright trace.
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
      - name: Unpack build artifact
        run: |
          tar -xf next-build.tar.zst
          rm next-build.tar.zst
      - name: Run Playwright tests
        env:
          QASE_TESTOPS_RUN_ID: ${{ needs.create-qase-run.outputs.run_id || '' }}
          QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TOKEN }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          E2E_SKIP_BUILD: "1" # serve the prebuilt .next from the build job
          # `next start` re-reads next.config.mjs, which keys output: standalone off
          # this var — keep it so the config matches what the build job produced.
          E2E_PROD_BUILD: "1"
          TEST_WALLET_SEED_PHRASE: ${{ secrets.TEST_WALLET_SEED_PHRASE }}
          TEST_WALLET_PASSWORD: ${{ secrets.TEST_WALLET_PASSWORD }}
        run: |
          if [ -n "$QASE_TESTOPS_API_TOKEN" ] && [ -n "$QASE_TESTOPS_RUN_ID" ]; then
            echo "Running tests with Qase reporting (Run ID: $QASE_TESTOPS_RUN_ID)"
            xvfb-run -a pnpm run test:ci:e2e:qase \
              --shard "$SHARD"
          else
            echo "Running tests without Qase reporting (API token or run ID not available)"
            xvfb-run -a pnpm run test:ci:e2e \
              --shard "$SHARD"
          fi
      - name: Upload blob report to Github Actions Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
          # "Re-run failed jobs" keeps prior-attempt artifacts (merge-reports needs the
          # passing shards' blobs), so a re-run shard must replace its own.
          overwrite: true

  merge-reports:
    # Skipped shards (build failed) produce no blob reports — running would only
    # stack a download failure on top of the real one.
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    needs: [test]
    timeout-minutes: 3
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
      html_report_name: ${{ steps.report-name.outputs.name }}
      report_encrypted: ${{ steps.package.outputs.encrypted }}

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Download blob reports from GitHub Actions Articfacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML and JSON Reports
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
      - uses: daun/playwright-report-summary@be9e270edd5ad86038604d3caa84a819a6ff6fed # v3.10.0
        id: summary
        with:
          report-file: ./report.json
          create-comment: false
      # Job outputs (unlike github.run_attempt) survive a "re-run failed jobs" retry: if this
      # job already succeeded it won't re-run, so publish-report must download by the name it
      # actually uploaded under, not by recomputing the (now-incremented) run attempt itself.
      - name: Set report artifact name
        id: report-name
        run: echo "name=html-report--attempt-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      # The full report carries un-stripped traces (network bodies, DOM snapshots, console
      # logs), and artifact download on a public repo is open to any logged-in GitHub
      # account — so encrypt at rest and share the key out-of-band. AES-256 zip (not 7z,
      # not ZipCrypto): strong crypto that macOS Archive Utility decrypts by double-click.
      # Plaintext is allowed ONLY for fork PRs (no secrets there, and no wallet secrets in
      # their traces either); a same-repo run missing the key is a misconfiguration and
      # fails loudly rather than silently uploading un-stripped traces unencrypted.
      - name: Package and encrypt HTML report
        id: package
        env:
          REPORT_KEY: ${{ secrets.PLAYWRIGHT_REPORT_ENCRYPTION_KEY }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mkdir report-artifact
          if [ -n "$REPORT_KEY" ]; then
            # runner images ship 7-Zip as 7zz (official) or 7z (p7zip) depending on generation
            SEVENZIP=$(command -v 7zz || command -v 7z)
            "$SEVENZIP" a -tzip -mem=AES256 -p"$REPORT_KEY" report-artifact/playwright-report.zip playwright-report
            echo "encrypted=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "Fork PR (no secrets); uploading report unencrypted."
            cp -r playwright-report report-artifact/playwright-report
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PLAYWRIGHT_REPORT_ENCRYPTION_KEY is not set for a same-repo run; refusing to upload the un-stripped report unencrypted."
            exit 1
          fi
      - name: Upload HTML report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.report-name.outputs.name }}
          path: report-artifact
          retention-days: 4

  # Publishes each report to its own path on the gh-pages branch (keep_files accumulates
  # across PRs/runs); the playwright-cleanup-reports.yml cron prunes + compacts it.
  publish-report:
    # Requires merge-reports to have actually succeeded (not just "not cancelled") — otherwise
    # a merge-reports failure (e.g. blob-download flake) still lets this job start, find no
    # artifact to download, and fail a second time on top of the real failure.
    # !cancelled() is load-bearing: without a status-check function in the expression GitHub
    # implicitly ANDs in success(), which is false whenever any upstream job (i.e. a test
    # shard) failed — and failed runs are exactly when the report matters most.
    # Same-repo only: fork PRs get a read-only GITHUB_TOKEN (push would fail) and we must
    # not host untrusted fork HTML on our public Pages domain.
    if: ${{ !cancelled() && needs.merge-reports.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [merge-reports]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    outputs:
      report_url: ${{ steps.report-url.outputs.url }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          # peaceiris pushes with its own github_token below, so don't leave the default
          # GITHUB_TOKEN persisted in .git/config for later steps to read.
          persist-credentials: false
      - name: Download HTML report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.merge-reports.outputs.html_report_name }}
          path: report-artifact
      # Decrypt/unpack into ./playwright-report. All intermediates (report-artifact/) stay
      # OUTSIDE playwright-report/ — peaceiris publishes that dir verbatim, so anything
      # decrypted into it would end up on the public Pages site.
      - name: Unpack HTML report
        env:
          REPORT_KEY: ${{ secrets.PLAYWRIGHT_REPORT_ENCRYPTION_KEY }}
          REPORT_ENCRYPTED: ${{ needs.merge-reports.outputs.report_encrypted }}
        run: |
          set -euo pipefail
          if [ "$REPORT_ENCRYPTED" = "true" ]; then
            SEVENZIP=$(command -v 7zz || command -v 7z)
            "$SEVENZIP" x -p"$REPORT_KEY" report-artifact/playwright-report.zip
          else
            mv report-artifact/playwright-report playwright-report
          fi
          rm -rf report-artifact
      # Public Pages: strip the trace viewer UI and trace .zip attachments so secrets can't
      # leak (see JUM-1235); keep only .png/.webm files under data/. This does NOT cover
      # small attachments Playwright embeds inline in index.html (stdout, error-context, any
      # testInfo.attach with a `body`) — don't add attachments with raw text bodies to specs.
      - name: Strip trace data before publishing
        run: |
          echo "Report size before: $(du -sh playwright-report | cut -f1)"
          rm -rf playwright-report/trace
          if [ -d playwright-report/data ]; then
            find playwright-report/data -type f ! -name '*.png' ! -name '*.webm' -delete
            find playwright-report/data -type d -empty -delete
          fi
          echo "Report size after: $(du -sh playwright-report | cut -f1)"
      - name: Determine report path
        id: report-url
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
        run: |
          DATE=$(date -u +%Y%m%d)
          REPO_NAME="${REPO_FULL#*/}"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REPORT_PATH="pr-${PR_NUMBER}/${DATE}-${RUN_ID}-${RUN_ATTEMPT}"
          else
            REPORT_PATH="run-${DATE}-${RUN_ID}-${RUN_ATTEMPT}"
          fi
          echo "path=$REPORT_PATH" >> "$GITHUB_OUTPUT"
          echo "url=https://${REPO_OWNER}.github.io/${REPO_NAME}/${REPORT_PATH}/" >> "$GITHUB_OUTPUT"
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: ${{ steps.report-url.outputs.path }}
          keep_files: true

  # Closes the shared run once after all shards report; always() also rescues runs orphaned by cancellation.
  complete-qase-run:
    needs: [create-qase-run, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Complete Qase Test Run
        env:
          QASE_TOKEN: ${{ secrets.QASE_TOKEN }}
          QASE_RUN_ID: ${{ needs.create-qase-run.outputs.run_id }}
        run: |
          if [ -z "$QASE_TOKEN" ] || [ -z "$QASE_RUN_ID" ]; then
            echo "No Qase token or run id available, nothing to complete"
            exit 0
          fi

          curl --silent --fail --show-error --request POST \
            --url "https://api.qase.io/v1/run/WJ/$QASE_RUN_ID/complete" \
            --header "Token: $QASE_TOKEN" \
            --header 'accept: application/json'

  post-comment:
    # !cancelled() lets this run even when publish-report is skipped (fork PR), so the
    # summary still posts. Qase reporting still runs (create-qase-run/complete-qase-run);
    # only its PR-comment link was dropped in favour of the Pages report link.
    # The merge-reports guard keeps a run with no results (failed or skipped build/shards)
    # from overwriting the previous summary with an empty sticky comment.
    needs: [merge-reports, publish-report]
    if: ${{ !cancelled() && needs.merge-reports.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          message: |
            ${{ needs.merge-reports.outputs.summary }}

            ${{ needs.publish-report.result == 'success' && needs.publish-report.outputs.report_url != '' && format('📊 [View Playwright Report]({0}) (kept 7 days)', needs.publish-report.outputs.report_url) || '' }}

            📥 [Download full report with traces](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) (kept 4 days) — ${{ needs.merge-reports.outputs.report_encrypted == 'true' && 'encrypted; see [tests/README.md](https://github.com/jumperexchange/jumper-exchange/blob/develop/tests/README.md#ci-reports) for how to decrypt and open it.' || 'unzip, then `npx playwright show-report <dir>`.' }}

  notify-slack-on-failure:
    needs: [test, merge-reports]
    # Same-repo PRs only — forks don't receive the Slack webhook secret, so on a
    # fork PR this job can only fail on top of the real failure.
    if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack payload
        id: build-payload
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Build blocks using jq — all values come from safe env vars
          BLOCKS=$(jq -n \
            --arg author "$PR_AUTHOR" \
            --arg repo_url "$REPO_URL" \
            --arg repo_name "$REPO_NAME" \
            --arg pr_url "$PR_URL" \
            --arg pr_number "$PR_NUMBER" \
            --arg pr_title "$PR_TITLE" \
            --arg workflow_url "$WORKFLOW_URL" \
            '[
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "❌ UI Tests Failed"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n<\($repo_url)|\($repo_name)>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Pull Request:*\n<\($pr_url)|#\($pr_number) - \($pr_title)>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n<@\($author)>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Workflow Run:*\n<\($workflow_url)|View Run>"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<@\($author)> Please review the test failures and fix any issues."
                }
              },
              {
                "type": "divider"
              }
            ]')
          
          PAYLOAD=$(jq -n \
            --argjson blocks "$BLOCKS" \
            '{
              "channel": "#jumper-ui-tests",
              "text": "❌ UI Tests Failed",
              "blocks": $blocks
            }')
          
          echo "payload<<EOF" >> "$GITHUB_OUTPUT"
          echo "$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      
      - name: Send Slack notification
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_UI_TESTS }}
          payload: ${{ steps.build-payload.outputs.payload }}
