name: Migrate secrets to jumper-frontend

# One-shot helper: copies this repo's Actions secrets into
# jumperexchange/jumper-frontend. Values are injected at runtime and never
# printed. Delete this workflow and the MIGRATION_TARGET_PAT secret afterwards.

on:
  workflow_dispatch:

permissions: {}

jobs:
  copy-repo-secrets:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MIGRATION_TARGET_PAT }}
      TARGET: jumperexchange/jumper-frontend
    steps:
      - name: Copy repository-level secrets
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_PAGES_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CF_ZONE: ${{ secrets.CF_ZONE }}
          DEPLOY_SSH: ${{ secrets.DEPLOY_SSH }}
          GCP_ENV_PROJECT: ${{ secrets.GCP_ENV_PROJECT }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          INTERCOM_SECRET_KEY: ${{ secrets.INTERCOM_SECRET_KEY }}
          NEXT_PUBLIC_INTERCOM_APP_ID: ${{ secrets.NEXT_PUBLIC_INTERCOM_APP_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          PLAYWRIGHT_REPORT_ENCRYPTION_KEY: ${{ secrets.PLAYWRIGHT_REPORT_ENCRYPTION_KEY }}
          QA_APP_ID: ${{ secrets.QA_APP_ID }}
          QA_APP_PRIVATE_KEY: ${{ secrets.QA_APP_PRIVATE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SLACK_WEBHOOK_URL_QA: ${{ secrets.SLACK_WEBHOOK_URL_QA }}
          SLACK_WEBHOOK_URL_UI_TESTS: ${{ secrets.SLACK_WEBHOOK_URL_UI_TESTS }}
          TEST_WALLET_PASSWORD: ${{ secrets.TEST_WALLET_PASSWORD }}
          TEST_WALLET_SEED_PHRASE: ${{ secrets.TEST_WALLET_SEED_PHRASE }}
        run: |
          set -euo pipefail
          names="APP_PRIVATE_KEY CF_ACCOUNT_ID CF_PAGES_API_TOKEN CF_TOKEN CF_ZONE \
            DEPLOY_SSH GCP_ENV_PROJECT GCP_SERVICE_ACCOUNT GCP_WORKLOAD_IDENTITY_PROVIDER \
            INTERCOM_SECRET_KEY NEXT_PUBLIC_INTERCOM_APP_ID NEXT_PUBLIC_SENTRY_DSN \
            PLAYWRIGHT_REPORT_ENCRYPTION_KEY QA_APP_ID QA_APP_PRIVATE_KEY SENTRY_AUTH_TOKEN \
            SLACK_WEBHOOK_URL_QA SLACK_WEBHOOK_URL_UI_TESTS TEST_WALLET_PASSWORD TEST_WALLET_SEED_PHRASE"
          for name in $names; do
            value="${!name-}"
            if [ -z "${value}" ]; then
              echo "::warning::skipping ${name} (empty in source)"
              continue
            fi
            printf '%s' "${value}" | gh secret set "${name}" -R "${TARGET}"
            echo "set ${name}"
          done

  copy-production-env-secret:
    runs-on: ubuntu-latest
    environment: Production
    env:
      GH_TOKEN: ${{ secrets.MIGRATION_TARGET_PAT }}
      TARGET: jumperexchange/jumper-frontend
    steps:
      - name: Copy Production environment secret (GCP_ENV_PROJECT)
        env:
          GCP_ENV_PROJECT: ${{ secrets.GCP_ENV_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${GCP_ENV_PROJECT-}" ]; then
            echo "::warning::Production GCP_ENV_PROJECT empty; nothing to copy"
            exit 0
          fi
          printf '%s' "${GCP_ENV_PROJECT}" | gh secret set GCP_ENV_PROJECT -R "${TARGET}" --env Production
          echo "set Production/GCP_ENV_PROJECT"
